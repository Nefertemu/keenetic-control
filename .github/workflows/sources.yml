name: Доступность источников

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: Свежие полные списки
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Выбрать Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Проверить все источники
        env:
          KC_LIVE_DOMAIN_SOURCES: '1'
        run: |
          mkdir -p .build
          set -o pipefail
          ./Tools/test.sh --filter StrictSourceLoaderTests/testLiveCatalogSourcesAreFreshAndComplete 2>&1 | tee .build/sources-check.log
      - name: Сохранить результат
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sources-check
          path: .build/sources-check.log
